version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      python-deps:
        patterns: ["*"]
    ignore:
      # meteostat 2 removed the Daily and Stations API that src/weather_model.py uses.
      - dependency-name: "meteostat"
        versions: [">=2"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
