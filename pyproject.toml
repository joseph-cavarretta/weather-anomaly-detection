[project]
name = "weather-anomaly-detection"
version = "0.1.0"
description = "Unsupervised anomaly detection on historical weather data using Isolation Forest"
requires-python = ">=3.12"
dependencies = [
    "joblib>=1.4.0",
    "meteostat>=1.6.5,<2",
    "numpy>=2.0.0",
    "pandas>=2.2.0,<4",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "scikit-learn>=1.5.0",
    "statsmodels>=0.14.0",
    "google-cloud-storage>=2.17.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "mypy>=1.10",
    "ruff>=0.16",
    "jupyter>=1.0.0",
    "pandas-stubs>=3.0.5.260914",
]

[tool.ruff]
extend = "../agent-dev-harness/python-styleguide/ruff-base.toml"

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.mypy]
strict = true
# Same loose paths as the lint baseline: scripts/ and .local/ are not checked.
exclude = ['(^|/)scripts/', '(^|/)\.local/']
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# These packages ship no type information.
module = ["airflow.*", "joblib.*", "meteostat.*", "sklearn.*", "statsmodels.*"]
ignore_missing_imports = true
