[project]
name = "weather-anomaly-detection"
version = "0.1.0"
description = "Unsupervised anomaly detection on historical weather data using Isolation Forest"
requires-python = ">=3.12"
dependencies = [
    "joblib>=1.4.0",
    "meteostat>=2.1.4,<3",
    "numpy>=2.5.1",
    "pandas>=3.0.3,<4",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "scikit-learn>=1.5.0",
    "statsmodels>=0.14.0",
    "google-cloud-storage>=2.17.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "mypy>=1.0.0",
    "ruff>=0.4.0",
    "jupyter>=1.0.0",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "SIM", "S"]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.ruff.lint.per-file-ignores]
# exploratory notebook: allow long lines, late imports, and == True masks
"*.ipynb" = ["E402", "E501", "E712"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
